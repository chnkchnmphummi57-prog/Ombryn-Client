name: Build Ombryn

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Ombryn
        shell: cmd
        run: build.bat

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: Ombryn-Build
          path: |
            ombryn.dll
            injector.exe
